[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Rota ESPECÍFICA para remover item (vem primeiro, é mais específica)
[[redirects]]
  from = "/api/comanda/:id/item/:index"
  to = "/.netlify/functions/comanda-item/:id/:index"
  status = 200

# Rota GENÉRICA para o resto (GET, POST, DELETE da comanda)
[[redirects]]
  from = "/api/comanda/*"
  to = "/.netlify/functions/comanda/:splat"
  status = 200
