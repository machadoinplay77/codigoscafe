[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Rota ESPECÍFICA para remover item (vem PRIMEIRO, é mais específica)
[[redirects]]
  from = "/api/comanda/*/item/*"
  to = "/.netlify/functions/comanda-item/:splat"
  status = 200

# Rota GENÉRICA para o resto (GET, POST, DELETE da comanda)
[[redirects]]
  from = "/api/comanda/*"
  to = "/.netlify/functions/comanda/:splat"
  status = 200
