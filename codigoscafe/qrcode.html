<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Gerador de QR Codes - Comandas Tropicana</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    .toolbar {
      text-align: center;
      margin-bottom: 20px;
    }

    .toolbar button {
      padding: 10px 20px;
      font-size: 16px;
      background: #2196F3;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin: 0 5px;
    }

    .toolbar button:hover {
      background: #1976D2;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      max-width: 800px;
      margin: 0 auto;
    }

    .comanda-card {
      background: white;
      border: 2px solid #333;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      page-break-inside: avoid;
    }

    .comanda-card h2 {
      margin: 0 0 15px 0;
      font-size: 22px;
      color: #2196F3;
    }

    .qrcode-container {
      display: inline-block;
      padding: 10px;
      background: white;
      border: 1px solid #eee;
    }

    .comanda-url {
      font-size: 10px;
      color: #999;
      margin-top: 10px;
      font-family: monospace;
      word-break: break-all;
    }

    .logo {
      max-width: 120px;
      margin-bottom: 10px;
    }

    @media print {
      body {
        background: white;
        padding: 0;
      }

      .toolbar {
        display: none;
      }

      .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .comanda-card {
        border: 2px dashed #333;
        padding: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button onclick="window.print()">🖨️ Imprimir QR Codes</button>
  </div>

  <h1>QR Codes das Comandas - Tropicana</h1>

  <div class="grid" id="grid">
    <!-- Os cartões serão gerados pelo JS -->
  </div>

  <script>
    const URL_BASE = "https://codigoscafe.netlify.app/api/comanda/";
    const TOTAL_COMANDAS = 10;

    const grid = document.getElementById("grid");

    for (let i = 1; i <= TOTAL_COMANDAS; i++) {
      const numero = i.toString().padStart(2, "0");
      const url = URL_BASE + numero;

      const card = document.createElement("div");
      card.className = "comanda-card";

      const titulo = document.createElement("h2");
      titulo.textContent = "COMANDA " + numero;
      card.appendChild(titulo);

      const qrContainer = document.createElement("div");
      qrContainer.className = "qrcode-container";
      qrContainer.id = "qr-" + numero;
      card.appendChild(qrContainer);

      const urlText = document.createElement("div");
      urlText.className = "comanda-url";
      urlText.textContent = url;
      card.appendChild(urlText);

      grid.appendChild(card);

      // Gera o QR Code
      new QRCode(qrContainer, {
        text: url,
        width: 200,
        height: 200,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }
  </script>
</body>
</html>
